name: Test and publish module preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ucp2-legacy-test-module
          path: dist/*
  release:
    needs: tests
    # PR code never receives a write token. Branch pushes publish previews on
    # that branch's repository; the default branch remains a normal test run.
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ucp2-legacy-test-module
          path: dist
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="test-${SOURCE_COMMIT:0:12}"
          printf 'Installable UCP2-Legacy preview for commit `%s`.\n\nUnsigned development build; see the module CHANGELOG.md and the associated pull request for scope and validation.\n' "$SOURCE_COMMIT" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$SOURCE_COMMIT" --prerelease --title "UCP2-Legacy preview ${SOURCE_COMMIT:0:12}" --notes-file notes.md
          fi
